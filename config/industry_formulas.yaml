# Per-industry scoring inputs. Only these keys are read by src/scoring.py:
# base_score (industry factor), target_multiple_low/high (valuation range).
# Per-industry sub-weights were removed 2026-07-04 (Decision 2, Option A):
# their factor taxonomy never matched the 8-factor MASTER_WEIGHTS model.
industries:
  hvac:
    display_name: HVAC
    base_score: 95
    target_multiple_low: 2.5
    target_multiple_high: 4.0

  plumbing:
    display_name: Plumbing
    base_score: 95
    target_multiple_low: 2.5
    target_multiple_high: 4.0

  electrical:
    display_name: Electrical
    base_score: 94
    target_multiple_low: 2.5
    target_multiple_high: 4.0

  laundromat:
    display_name: Laundromat
    base_score: 92
    target_multiple_low: 3.5
    target_multiple_high: 5.5

  pest_control:
    display_name: Pest Control
    base_score: 93
    target_multiple_low: 3.0
    target_multiple_high: 5.0

  commercial_cleaning:
    display_name: Commercial Cleaning
    base_score: 91
    target_multiple_low: 2.0
    target_multiple_high: 3.5

  car_wash:
    display_name: Car Wash
    base_score: 84
    target_multiple_low: 4.0
    target_multiple_high: 7.0

  self_storage:
    display_name: Self Storage
    base_score: 84
    target_multiple_low: 5.0
    target_multiple_high: 8.0

  pool_service:
    display_name: Pool Service
    base_score: 92
    target_multiple_low: 2.5
    target_multiple_high: 3.5

  roofing:
    display_name: Roofing
    base_score: 86
    target_multiple_low: 2.0
    target_multiple_high: 3.5

  # Off-thesis industries the live BizBuySell owner-financed feed sends anyway.
  # Explicit low base scores keep them from riding the 75-point default and
  # outranking the target list.
  restaurant:
    display_name: Restaurant / Food Service
    base_score: 30
    target_multiple_low: 1.5
    target_multiple_high: 2.5

  auto_repair:
    display_name: Auto Repair
    base_score: 55
    target_multiple_low: 2.0
    target_multiple_high: 3.0

  retail:
    display_name: Retail
    base_score: 35
    target_multiple_low: 1.5
    target_multiple_high: 2.5

  # Catch-all for unclassified listings. Values match scoring.DEFAULT_INDUSTRY
  # exactly (identical scores) — listing it here just stops the per-listing
  # "Unknown industry 'other'" warning spam in nightly logs.
  other:
    display_name: Other Essential Service
    base_score: 75
    target_multiple_low: 2.0
    target_multiple_high: 3.0
